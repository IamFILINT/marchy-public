<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1a1b26">
    <meta name="robots" content="noindex, follow">
    <title>Page not found — Marchy</title>
    <meta name="description" content="This page does not exist on the Marchy site.">

    <link rel="icon" type="image/svg+xml" href="/marchy-public/favicon.svg?v=9">
    <link rel="apple-touch-icon" href="/marchy-public/site/images/brand/apple-touch-icon.png">

    <link rel="stylesheet" type="text/css" href="/marchy-public/site/css/reset.css">
    <link rel="stylesheet" type="text/css" href="/marchy-public/site/css/root.css">
    <link rel="stylesheet" type="text/css" href="/marchy-public/site/css/fonts.css">
    <link rel="stylesheet" type="text/css" href="/marchy-public/site/css/elements.css">

    <style>
      .notfound {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 2rem;
        text-align: center;
      }

      .notfound h1 {
        color: var(--color-green);
        font-size: 4rem;
        font-weight: 700;
        margin: 0;
      }

      .notfound p {
        margin: 0;
        max-width: 34rem;
      }

      .notfound nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        justify-content: center;
      }
    </style>
  </head>

  <body>
    <main class="notfound">
      <h1>404</h1>
      <p>This page does not exist. It may have moved, or it never existed at all.</p>
      <nav>
        <a href="/marchy-public/">Marchy home</a>
        <a href="/marchy-public/docs/">Marchy docs</a>
        <a href="https://github.com/IamNOTfilint/marchy-public">Marchy on GitHub</a>
      </nav>
    </main>
  </body>
</html>
